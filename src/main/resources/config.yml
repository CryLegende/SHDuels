# SHDuels
#
# Duels 1v1 sur invitation dans l'arène définie par arena.pos1 et arena.pos2 (un seul duel à la fois par serveur).
# Pendant le duel, seules les commandes de allowed-commands restent utilisables.
#
# Commandes :
#   /duel <joueur>        Défie un joueur, ou accepte son défi.
#   /shduels pos1|pos2    Définit les positions de départ de l'arène à l'endroit où l'on se trouve.
#   /shduels end          Met fin au duel en cours (la console peut l'utiliser).
#   /shduels reload       Relit config.yml et messages.yml (la console peut l'utiliser). Appliqué au prochain duel ou à la
#                         prochaine commande ; le duel en cours garde ses durées. En cas d'erreur YAML, l'ancienne
#                         configuration reste en place et le fichier fautif est indiqué. reseau.actif demande un redémarrage.
#   /shduels status       Affiche l'état du duel, les duellistes et les positions de l'arène (la console peut l'utiliser).
#   /duel admin <pos1|pos2|end|reload|status> reste accepté comme ancienne forme de /shduels.
#
# Permissions :
#   shduels.admin          Toutes les sous-commandes de /shduels (par défaut : op).
#   shduels.admin.pos1     /shduels pos1 (par défaut : op).
#   shduels.admin.pos2     /shduels pos2 (par défaut : op).
#   shduels.admin.end      /shduels end (par défaut : op).
#   shduels.admin.reload   /shduels reload (par défaut : op).
#   shduels.admin.status   /shduels status (par défaut : op).
#
# Les messages sont dans messages.yml. Les positions d'avant-duel sont gardées dans temp_data.yml le temps du duel :
# un joueur déconnecté pendant le duel y est replacé à sa reconnexion.
# Les positions arena.pos1 et arena.pos2 sont écrites par /shduels pos1 et pos2 : ne pas les éditer à la main.

duel-invitation-expiry: 30 # secondes
# Réglages facultatifs, valeur indiquée par défaut si la ligne est absente :
# duel-duration-seconds: 300           # durée maximale d'un duel, en secondes
# countdown-duration: 5                # compte à rebours avant le début, en secondes
# duel-win-broadcast-radius: 50.0      # rayon, en blocs, de l'annonce de la victoire
# duel-end-teleport-delay-ticks: 60    # délai avant le retour des duellistes à leur position d'avant-duel
allowed-commands:
- /msg
- /tell
- /r
arena:
  pos1:
    ==: org.bukkit.Location
    world: world
    x: 0.5
    y: 64.0
    z: 0.5
    pitch: 0.0
    yaw: 90.0
  pos2:
    ==: org.bukkit.Location
    world: world
    x: 20.5
    y: 64.0
    z: 0.5
    pitch: 0.0
    yaw: -90.0
countdown-sound: BLOCK_NOTE_BLOCK_PLING
start-sound: BLOCK_NOTE_BLOCK_PLING
lose-sound: ENTITY_ZOMBIE_BREAK_WOODEN_DOOR

# Mode réseau, actif seulement si SHNetwork est installé. Les duels se jouent dans le monde de arena.pos1 et
# arena.pos2 : sur un serveur qui ne fait que copier ce monde (liste mondes-distants de SHNetwork), /duel répond
# que le duel se joue sur le serveur de l'arène, et un défi vers un joueur d'un autre serveur répond qu'il n'est pas
# à portée au lieu de « joueur non trouvé ». Rien à régler : l'hôte de l'arène est lu dans mondes-distants.
reseau:
  actif: true
